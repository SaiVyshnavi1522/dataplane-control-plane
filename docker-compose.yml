name: dataplane

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: dataplane
      POSTGRES_PASSWORD: dataplane
      POSTGRES_DB: dataplane
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dataplane -d dataplane"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    environment:
      DATABASE_URL: postgres://dataplane:dataplane@postgres:5432/dataplane?sslmode=disable
      PROVISIONER: mock
      WORKERS: ${WORKERS:-4}
      FAILURE_INJECTION_ATTEMPTS: ${FAILURE_INJECTION_ATTEMPTS:-0}
      SNAPSHOT_ENDPOINT_TEMPLATE: http://opensearch:9200
      SNAPSHOT_S3_ENDPOINT: minio:9000
      SNAPSHOT_S3_BUCKET: dataplane-snapshots
      API_KEYS: ${API_KEYS:-local-admin:admin:local-admin-key-change-me,local-viewer:viewer:local-viewer-key-change-me}
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
    ports:
      - "8080:8080"
      - "9091:9091"
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      jaeger:
        condition: service_started

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: dataplane
      MINIO_ROOT_PASSWORD: dataplane-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 30

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mc alias set local http://minio:9000 dataplane dataplane-secret &&
        mc mb --ignore-existing local/dataplane-snapshots

  opensearch:
    build:
      context: deploy/opensearch
    environment:
      discovery.type: single-node
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
      AWS_ACCESS_KEY_ID: dataplane
      AWS_SECRET_ACCESS_KEY: dataplane-secret
      AWS_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
    ports:
      - "9200:9200"
    volumes:
      - opensearchdata:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 60

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:12.1.1
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/jaeger:2.13.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"

volumes:
  pgdata:
  miniodata:
  opensearchdata:
