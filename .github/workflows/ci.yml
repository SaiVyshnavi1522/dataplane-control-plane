name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dataplane
          POSTGRES_PASSWORD: dataplane
          POSTGRES_DB: dataplane
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dataplane -d dataplane"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://dataplane:dataplane@localhost:5432/dataplane?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.x'
          cache: true
      - name: Install protoc 3.20.3
        shell: bash
        run: |
          PROTOC_ARCHIVE="${RUNNER_TEMP}/protoc-3.20.3.zip"
          PROTOC_ROOT="${RUNNER_TEMP}/protoc-3.20.3"
          curl --fail --location --retry 3 \
            https://github.com/protocolbuffers/protobuf/releases/download/v3.20.3/protoc-3.20.3-linux-x86_64.zip \
            --output "${PROTOC_ARCHIVE}"
          echo '44a6b498e996b845edef83864734c0e52f42197e85c9d567af55f4e3ff09d755  '"${PROTOC_ARCHIVE}" | sha256sum --check
          unzip -q "${PROTOC_ARCHIVE}" -d "${PROTOC_ROOT}"
          sudo install -m 0755 "${PROTOC_ROOT}/bin/protoc" /usr/local/bin/protoc
          sudo cp -R "${PROTOC_ROOT}/include/." /usr/local/include/
          protoc --version
      - name: Generate protobuf API
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.10
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          make proto
          git diff --exit-code
      - name: Format check
        run: |
          go fmt ./...
          git diff --exit-code
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -cover ./...
      - name: Build
        run: go build -trimpath -o "${RUNNER_TEMP}/dataplane" ./cmd/api
