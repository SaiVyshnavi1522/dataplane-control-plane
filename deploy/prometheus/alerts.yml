groups:
  - name: dataplane-control-plane
    rules:
      - alert: DataPlaneAPIDown
        expr: up{job="dataplane"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: DataPlane API is not being scraped
      - alert: DataPlaneHighHTTPErrorRate
        expr: sum(rate(dataplane_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(dataplane_http_requests_total[5m])), 0.001) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: More than 5% of HTTP requests are failing
      - alert: DataPlaneHighP95Latency
        expr: histogram_quantile(0.95, sum(rate(dataplane_http_request_duration_seconds_bucket[5m])) by (le)) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: HTTP p95 latency is above one second
      - alert: DataPlaneTerminalJobFailures
        expr: increase(dataplane_jobs_processed_total{outcome="error"}[10m]) > 5
        labels:
          severity: critical
        annotations:
          summary: Lifecycle jobs are repeatedly failing
      - alert: DataPlaneNoWorkers
        expr: dataplane_active_workers < 1
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: No lifecycle workers are active
